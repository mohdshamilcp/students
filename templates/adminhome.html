<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Home</title>

  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background: #333;
      color: #e5e7eb;
      font-family: Arial, sans-serif;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      flex: 0 0 220px;
      padding: 24px 14px;
      background: #1f1f1f;
      border-right: 1px solid #444;
    }

    .sidebar h1 {
      margin: 0 0 24px;
      text-align: center;
      font-size: 22px;
    }

    .menu {
      display: grid;
      gap: 5px;
    }

    .menu a {
      padding: 9px 10px;
      border-radius: 6px;
      color: #e5e7eb;
      font-size: 14px;
      text-decoration: none;
    }

    .menu a:hover {
      background: #333;
    }

    .menu .logout {
      margin-top: 8px;
      color: #ff8a8a;
    }

    .main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 40px 24px;
    }

    .welcome-card {
      width: min(100%, 700px);
      padding: 32px;
      background: #1f1f1f;
      border: 1px solid #444;
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
    }

    .welcome-card h2 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .welcome-card p {
      margin: 0;
      color: #b8c0cc;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      .sidebar {
        flex-basis: 170px;
        padding: 20px 10px;
      }

      .main {
        padding: 24px 12px;
      }

      .welcome-card {
        padding: 22px;
      }
    }
  </style>
</head>

<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>Admin</h1>

      <nav class="menu">
          <a href="/myapp/adminhome/">Home</a>
        <a href="/myapp/viewuser/">View Users</a>
        <a href="/myapp/viewcomplaint/">View Complaints</a>
        <a class="logout" href="/myapp/login/">Log out</a>
      </nav>
    </aside>

    <main class="main">
      <section class="welcome-card">
        <h2>Admin Dashboard</h2>
        <p>Select an option from the menu to manage users or review complaints.</p>
      </section>
    </main>
  </div>
</body>
</html>
