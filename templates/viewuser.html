<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>View Users</title>

  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background: #333;
      color: #e5e7eb;
      font-family: Arial, sans-serif;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      flex: 0 0 220px;
      padding: 24px 14px;
      background: #1f1f1f;
      border-right: 1px solid #444;
    }

    .sidebar h1 {
      margin: 0 0 24px;
      text-align: center;
      font-size: 22px;
    }

    .menu {
      display: grid;
      gap: 5px;
    }

    .menu a {
      padding: 9px 10px;
      border-radius: 6px;
      color: #e5e7eb;
      font-size: 14px;
      text-decoration: none;
    }

    .menu a:hover { background: #333; }
    .menu .logout { margin-top: 8px; color: #ff8a8a; }

    .main {
      flex: 1;
      padding: 40px 24px;
      overflow-x: auto;
    }

    .content-card {
      width: min(100%, 1000px);
      margin: 0 auto;
      padding: 28px;
      background: #1f1f1f;
      border: 1px solid #444;
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
    }

    h2 {
      margin: 0 0 22px;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #444;
      vertical-align: middle;
    }

    th {
      background: #292929;
      color: #aebeff;
    }

    td img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
    }

    .empty {
      padding: 20px 0;
      color: #aaa;
      text-align: center;
    }

    @media (max-width: 600px) {
      .sidebar { flex-basis: 170px; padding: 20px 10px; }
      .main { padding: 20px 12px; }
      .content-card { padding: 18px; }
      th, td { padding: 9px; }
    }
  </style>
</head>

<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>Admin</h1>

      <nav class="menu">
        <a href="/myapp/adminhome/">Home</a>
        <a href="/myapp/viewuser/">View Users</a>
        <a href="/myapp/viewcomplaint/">View Complaints</a>
        <a class="logout" href="/myapp/login/">Log out</a>
      </nav>
    </aside>

    <main class="main">
      <section class="content-card">
        <h2>Users</h2>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Sl no</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Gender</th>
                <th>Photo</th>
              </tr>
            </thead>
            <tbody>
              {% for user in i %}
                <tr>
                  <td>{{ forloop.counter }}</td>
                  <td>{{ user.name }}</td>
                  <td>{{ user.email }}</td>
                  <td>{{ user.phone }}</td>
                  <td>{{ user.gender }}</td>
                  <td>
                    <img src="{{ user.photo }}" alt="{{ user.name }}'s photo">
                  </td>
                </tr>
              {% empty %}
                <tr>
                  <td colspan="6" class="empty">No users found.</td>
                </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
