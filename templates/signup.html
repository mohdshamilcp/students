<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 30px 0;
      display: grid;
      place-items: center;
      background:#333333;
      font-family: Arial, sans-serif;
      color: #202b3c;
    }

    .signup-card {
      width: min(90%, 460px);
      padding: 34px;
      background: lightgrey;
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(30, 50, 90, 0.12);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
    }

    .subtitle {
      margin: 0 0 26px;
      text-align: center;
      color: #718096;
    }

    .field {
      margin-bottom: 16px;
    }

    label, .field-title {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="file"] {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      background: white;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #9bb8ff;
      border-color: #4169e1;
    }

    .radio-options {
      display: flex;
      gap: 20px;
      margin-top: 8px;
    }

    .radio-options label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-weight: normal;
      cursor: pointer;
    }

    .radio-options input {
      accent-color: #4169e1;
    }

    .password-match {
      border: 2px solid green !important;
      color: green;
    }

    .password-mismatch {
      border: 2px solid red !important;
      color: red;
    }

    .submit-button {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #333333;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-button:hover {
      background: #3154c6;
    }

    .login-link {
      margin: 20px 0 0;
      text-align: center;
      color: #718096;
    }

    .login-link a {
      color: #4169e1;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="signup-card">
    <h1>Create account</h1>
    <p class="subtitle">Sign up to get started</p>

    <form id="signup-form" action="/myapp/signup_post/" enctype="multipart/form-data" method="post">
      {% csrf_token %}

      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="phone">Phone</label>
        <input type="" id="phone" name="phone" required>
      </div>

      <div class="field">
        <span class="field-title">Gender</span>
        <div class="radio-options">
          <label><input type="radio" name="gender" value="male" required> Male</label>
          <label><input type="radio" name="gender" value="female"> Female</label>
        </div>
      </div>

      <div class="field">
        <label for="photo">Photo</label>
        <input type="file" id="photo" name="photo" accept="image/*" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>

      <div class="field">
        <label for="cpassword">Confirm password</label>
        <input type="password" id="cpassword" name="cpassword" required>
      </div>

      <button class="submit-button" type="submit">Create account</button>
    </form>

    <p class="login-link">
      Already have an account? <a href="/myapp/login/">Log in</a>
    </p>
  </main>

  <script>
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("cpassword");
    const signupForm = document.getElementById("signup-form");

    function checkPasswords() {
      confirmPassword.classList.remove("password-match", "password-mismatch");

      if (!confirmPassword.value) return;

      if (password.value === confirmPassword.value) {
        confirmPassword.classList.add("password-match");
      } else {
        confirmPassword.classList.add("password-mismatch");
      }
    }

    password.addEventListener("input", checkPasswords);
    confirmPassword.addEventListener("input", checkPasswords);

    signupForm.addEventListener("submit", function (event) {
      if (password.value !== confirmPassword.value) {
        event.preventDefault();
        confirmPassword.focus();
      }
    });
  </script>
</body>
</html>
