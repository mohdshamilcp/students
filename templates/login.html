<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:#000;
      font-family: Arial, sans-serif;
      color:#f7f8fc;
    }

    .login-card {
      width: min(90%, 400px);
      padding: 36px;
      background: #1f1f1f;
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(30, 50, 90, 0.12);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
    }

    .subtitle {
      margin: 0 0 28px;
      text-align: center;
      color: #718096;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #9bb8ff;
      border-color: #4169e1;
    }

    .password-row {
      display: flex;
      gap: 8px;
    }

    .password-row input {
      flex: 1;
      min-width: 0;
    }

    .toggle-button {
      padding: 0 12px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      background: #f7f8fc;
      cursor: pointer;
    }

    .login-button {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #333333;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-button:hover {
      background: #3154c6;
    }

    .signup-link {
      margin: 20px 0 0;
      text-align: center;
      color: #718096;
    }

    .signup-link a {
      color: #4169e1;
      font-weight: bold;
      text-decoration: none;
    }

    #form-message {
      min-height: 18px;
      margin: 10px 0 0;
      color: #c53030;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to your account</p>

    <form id="login-form" action="/myapp/login_post/" method="post">
      {% csrf_token %}

      <div class="field">
        <label for="username">Email</label>
        <input
          type="email"
          id="username"
          name="username"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-row">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>
      </div>

      <p id="form-message" aria-live="polite"></p>
      <button class="login-button" type="submit">Log in</button>
    </form>

    <p class="signup-link">
      Don’t have an account? <a href="/myapp/signup/">Sign up</a>
    </p>
  </main>

  <script>
    const passwordInput = document.getElementById("password");
    const toggleButton = document.getElementById("toggle-password");
    const loginForm = document.getElementById("login-form");
    const message = document.getElementById("form-message");

    toggleButton.addEventListener("click", function () {
      const showingPassword = passwordInput.type === "text";
      passwordInput.type = showingPassword ? "password" : "text";
      toggleButton.textContent = showingPassword ? "Show" : "Hide";
    });

    loginForm.addEventListener("submit", function (event) {
      if (!loginForm.checkValidity()) {
        event.preventDefault();
        message.textContent = "Enter a valid email and password.";
      } else {
        message.textContent = "";
      }
    });
  </script>
</body>
</html>
