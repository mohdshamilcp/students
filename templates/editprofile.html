<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Profile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: #000;
      color: #e5e7eb;
      font-family: Arial, sans-serif;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      flex: 0 0 220px;
      padding: 24px 14px;
      background: #1f1f1f;
      border-right: 1px solid #333;
    }

    .sidebar-profile {
      margin-bottom: 24px;
      text-align: center;
    }

    .sidebar-photo {
      width: 76px;
      height: 76px;
      border: 2px solid #4169e1;
      border-radius: 50%;
      object-fit: cover;
    }

    .sidebar-profile h2 {
      margin: 10px 0 0;
      font-size: 18px;
      overflow-wrap: anywhere;
    }

    .menu {
      display: grid;
      gap: 5px;
    }

    .menu a {
      padding: 9px 10px;
      border-radius: 6px;
      color: #e5e7eb;
      font-size: 14px;
      text-decoration: none;
    }

    .menu a:hover {
      background: #333;
    }

    .menu .logout {
      margin-top: 8px;
      color: #ff8a8a;
    }

    .main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 40px 20px;
    }

    .form-card {
      width: min(100%, 520px);
      padding: 30px;
      background: #1f1f1f;
      border: 1px solid #333;
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 24px;
      text-align: center;
    }

    .field {
      margin-bottom: 16px;
    }

    .field > label,
    .field-title {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="email"],
    input[type="file"] {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #555;
      border-radius: 8px;
      background: #292929;
      color: #e5e7eb;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #9bb8ff;
      border-color: #4169e1;
    }

    .current-photo {
      display: block;
      width: 76px;
      height: 76px;
      margin: 8px 0 12px;
      border-radius: 50%;
      object-fit: cover;
    }

    .radio-options {
      display: flex;
      gap: 20px;
    }

    .radio-options label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
    }

    .radio-options input {
      accent-color: #4169e1;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    .buttons button,
    .buttons a {
      flex: 1;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #333333;
      color: white;
      font-size: 15px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .buttons button:hover,
    .buttons a:hover {
      background: #3154c6;
    }

    @media (max-width: 600px) {
      .sidebar {
        flex-basis: 170px;
        padding: 20px 10px;
      }

      .main {
        padding: 24px 12px;
      }

      .form-card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-profile">
        <img class="sidebar-photo" src="{{ i.photo }}" alt="{{ i.name }}'s photo">
        <h2>{{ i.name }}</h2>
      </div>

      <nav class="menu">
        <a href="/myapp/viewprofile/">View Profile</a>
        <a href="/myapp/addcontact/">Add Contact</a>
        <a href="/myapp/viewcontact/">View Contacts</a>
        <a href="/myapp/sendcomplaint/">Send Complaint</a>
        <a href="/myapp/viewreply/">View Reply</a>
        <a href="/myapp/changepassword/">Change Password</a>
        <a class="logout" href="/myapp/login/">Log out</a>
      </nav>
    </aside>

    <main class="main">
      <section class="form-card">
        <h1>Edit Profile</h1>

        <form action="/myapp/editprofile_post/"
              enctype="multipart/form-data"
              method="post">
          {% csrf_token %}

          <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" value="{{ i.name }}" required>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ i.email }}" required>
          </div>

          <div class="field">
            <label for="phone">Phone</label>
            <input type="text" id="phone" name="phone" value="{{ i.phone }}" required>
          </div>

          <div class="field">
            <span class="field-title">Gender</span>
            <div class="radio-options">
              <label>
                <input type="radio" name="gender" value="male"
                  {% if i.gender == "male" %}checked{% endif %} required>
                Male
              </label>

              <label>
                <input type="radio" name="gender" value="female"
                  {% if i.gender == "female" %}checked{% endif %}>
                Female
              </label>
            </div>
          </div>

          <div class="field">
            <label for="photo">Photo</label>
            <img class="current-photo" src="{{ i.photo }}" alt="Current profile photo">
            <input type="file" id="photo" name="photo" accept="image/*">
          </div>

          <div class="buttons">
            <button type="submit">Save Changes</button>
            <a href="/myapp/viewprofile/">Cancel</a>
          </div>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
